<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <title>{{TITLE}}</title>

    <style>
        :root {
            --bg: #fafafa;
            --text: #222;
            --table-bg: #fff;
            --border: #ddd;
            --header-bg: #f3f3f3;
            --hover: #f8f8f8;
            --input-bg: #fff;
            --link-bg: #f0f0f0;
            --link-hover: #e2e2e2;
        }

        [data-theme="dark"] {
            --bg: #181818;
            --text: #eee;
            --table-bg: #222;
            --border: #444;
            --header-bg: #2c2c2c;
            --hover: #292929;
            --input-bg: #222;
            --link-bg: #333;
            --link-hover: #444;
        }

        body {
            font-family: system-ui, sans-serif;
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
            background: var(--bg);
            color: var(--text);
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            margin-bottom: 16px;
            background: var(--input-bg);
            color: var(--text);
            border-color: var(--border);
            border-radius: 6px;
            font-size: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--table-bg);
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid #ddd;
            border-color: var(--border);
            text-align: left;
        }

        th {
            cursor: pointer;
            user-select: none;
            background: var(--header-bg);
        }

        tr:hover td {
            background: var(--hover);
        }

        th.sorted::after {
            content: " ▲";
            font-size: 0.7em;
        }

        th.sorted[data-order="desc"]::after {
            content: " ▼";
            font-size: 0.7em;
        }

        a {
            display: inline-block;
            padding: 4px 9px;
            border-radius: 5px;
            background: var(--link-bg);
            color: var(--text);
            text-decoration: none;
            font-size: 0.9em;
        }

        a:hover {
            background: var(--link-hover);
            text-decoration: none;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .toolbar input {
            flex: 1;
            margin: 0;
        }

        #theme-toggle {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--header-bg);
            color: var(--text);
            cursor: pointer;
            white-space: nowrap;
        }

        #theme-toggle:hover {
            background: var(--hover);
        }
    </style>
</head>

<body>

<div class="toolbar">
    <input
        type="search"
        id="search"
        placeholder="Search..."
        autocomplete="off"
    >

    <button id="theme-toggle" type="button">Dark mode</button>
</div>

<table id="table">
    <thead>
        <tr>
            {{HEADERS}}
        </tr>
    </thead>
    <tbody>
        {{ROWS}}
    </tbody>
</table>

<script>
const table = document.getElementById("table");
const search = document.getElementById("search");

// Search
search.addEventListener("input", () => {
    const query = search.value.toLowerCase();

    for (const row of table.tBodies[0].rows) {
        row.hidden = !row.textContent.toLowerCase().includes(query);
    }
});

// Sort
for (const th of table.tHead.rows[0].cells) {
    th.addEventListener("click", () => {
        const column = th.cellIndex;
        const rows = [...table.tBodies[0].rows];
        const ascending = th.dataset.order !== "asc";

        rows.sort((a, b) => {
            const x = a.cells[column].textContent.trim();
            const y = b.cells[column].textContent.trim();

            const nx = Number(x.replace(/[^\d.-]/g, ""));
            const ny = Number(y.replace(/[^\d.-]/g, ""));

            if (!isNaN(nx) && !isNaN(ny)) {
                return ascending ? nx - ny : ny - nx;
            }

            return ascending
                ? x.localeCompare(y)
                : y.localeCompare(x);
        });

        // Reset all headers
        for (const header of table.tHead.rows[0].cells) {
            header.dataset.order = "";
            header.classList.remove("sorted");
        }

        // Mark active column
        th.dataset.order = ascending ? "asc" : "desc";
        th.classList.add("sorted");

        for (const row of rows) {
            table.tBodies[0].appendChild(row);
        }
    });
}

const button = document.getElementById("theme-toggle");

button.addEventListener("click", () => {
    const dark = document.documentElement.dataset.theme === "dark";

    document.documentElement.dataset.theme = dark ? "light" : "dark";
    button.textContent = dark ? "Dark mode" : "Light mode";
});
</script>

</body>
</html>
